name: Build GALAXIUMOS ISO

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Liberar espacio en el runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h /

      - name: Compilar ISO dentro de Debian bookworm
        run: |
          docker run --rm --privileged -v "$PWD":/work -w /work debian:bookworm bash -c "
            apt-get update &&
            apt-get install -y live-build &&
            ./build.sh
          "

      - name: Subir ISO
        uses: actions/upload-artifact@v4
        with:
          name: galaxiumos-iso
          path: galaxiumos-1.0-amd64.iso
          if-no-files-found: error
          compression-level: 0
